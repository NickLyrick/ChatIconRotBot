app = "platinum"
primary_region = "ams"

# SIGINT makes aiohttp shut down gracefully: the dispatcher closes the database
# pool and the bot session. Five seconds was not enough room.
kill_signal = "SIGINT"
kill_timeout = "30s"

# Once per deploy, on a temporary machine, before the new version is rolled
# out: migrations, webhook registration, command lists. A failure aborts the deploy.
[deploy]
  release_command = "python -m src.release"

# The process group keeps its old name so the deploy updates the existing machine.
[processes]
  worker = "python main.py"

# Telegram delivers updates over a webhook and an external cron calls
# /jobs/tick, so the machine may sleep in between: the proxy stops it when idle
# and starts it on the next request. Every handler finishes its work before
# responding, so a stop never cuts a job short.
# Run a single machine (fly scale count 1); the jobs are claimed in the
# database, so a second one would be harmless but useless.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["worker"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
