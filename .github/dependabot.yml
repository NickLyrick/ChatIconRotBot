# Dependabot version updates:
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Dependabot reads this file from the default branch (master) only.
# Version updates target dev; security updates always target master and have
# to be retargeted to dev by hand.

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly

  # requirements.txt and requirements-dev.txt, one grouped PR a week.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
